<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23635BFF'/%3E%3Cpath d='M13 8h6M13.5 8v6.2L9.9 20.9c-.9 1.6.2 3.6 2.1 3.6h8c1.9 0 3-2 2.1-3.6l-3.6-6.7V8' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='14.2' cy='20.4' r='1.3' fill='white'/%3E%3Ccircle cx='17.8' cy='21.8' r='1' fill='white'/%3E%3C/svg%3E"
    />
    <title>TestPilot AI</title>
    <script>
      // Stamp the resolved theme before first paint so dark-mode users never
      // get a white flash. ThemeProvider takes over after hydration.
      try {
        var stored = localStorage.getItem("testpilot:theme");
        var dark = stored === "dark" || ((stored === null || stored === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
